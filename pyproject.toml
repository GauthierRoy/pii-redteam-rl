[project]
name = "pii-redteam-rl"
version = "0.1.0"
description = "RL-guided synthetic data for robust PII detection (M01 scaffolding)"
readme = "README.md"
requires-python = ">=3.10"
# uv is the single dependency-management method (`uv sync`, `uv run`).
# `requirements.txt` is a Colab/pip fallback exporting the same runtime set.
# Keep runtime deps minimal; uv.lock pins the tested environment (M01.2).
dependencies = [
  "pyyaml",
]

[dependency-groups]
dev = [
  "ruff>=0.16",
  "ty>=0.0.8",
  "pre-commit>=4.0",
]
# Optional ML stack (ModernBERT gate M03, Qwen smoke M05): locked, NOT installed by
# default. Install on demand: `uv sync --group ml` (or `uv run --group ml ...`).
# A plain `uv sync` removes it again (exact sync) - by design, it is opt-in.
ml = [
  "torch>=2.14",
  "transformers>=5.18",
  "accelerate>=1.0",
  "peft>=0.16",
]

# CPU-only torch: this machine has no CUDA; pin torch to the PyTorch CPU index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "artifacts",
  "outputs",
  "*.ipynb_checkpoints",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "W"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["pii_redteam"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
root = ["./src"]
python-version = "3.12"

[tool.ty.src]
include = ["src", "scripts"]
respect-ignore-files = true

# Heavy ML deps live in the optional `ml` group (locked, installed on demand).
# Ignore unresolved imports; ruff still catches typos via F821.
[tool.ty.rules]
unresolved-import = "ignore"
