# this run uses the committed v2 bank (new sha256).

run_id_prefix: m07b
model_id: Qwen/Qwen3.5-2B
adapter: null
seed: 20260920
repo_dir: null                     # Colab: /content/pii-redteam-rl; local: repo root
work_dir: artifacts/m07b           # raw samples + report (copied to results/ after the run)
repo_commit: null                  # recorded by the notebook / set by PROBE_REPO_COMMIT

bank:
  path: banks/v2_prompting/spark_seed20260920_v2_n20.jsonl
  sha256: 1f0b9960ac797c3fbbc5e26dc2658a11e76837ca47a79da9b0443d37a7708fb7

