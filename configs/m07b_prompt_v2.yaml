  validity_min: 0.90               # v2-validity rate per variant x temperature
  name_at_start_max: 0.40          # share of valid outputs opening with the name
  top10_openings_max: 0.30         # share covered by top-10 first-5-word patterns
  median_unique_valid_min: 6       # median unique valid texts per 8-sample group
