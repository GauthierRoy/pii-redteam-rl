    data/synthetic/d1_aug_v1.jsonl: c16e037dd978c5305e510474653ac573a6dde9e560a945da6428c8f31609eb3d
  aug_exclude_ids: [d1-aug-v1-01395]
  aug_dev_fraction: 0.10
  expected_rows: null
  short_eval:
