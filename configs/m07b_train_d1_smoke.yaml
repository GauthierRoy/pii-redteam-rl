# LOCAL CPU smoke for train-d1 and d1-final-eval: plumbing only.
# Starts from ModernBERT with a fresh head because frozen D0 lives on Drive, so
# its metrics mean nothing. Paths are overridden by the caller where needed.

run_id_prefix: d1-smoke
seed: 20260920
repo_dir: null
cache_dir: /tmp/pii-redteam-cache
work_dir: /tmp/d1_smoke_out
rebuild_locks: true

locks:
  final_eval_sha256: 513335badf5752a340698d3c7efa7029a8780c51fde2675c80ef4208ce27d39c

detector:
  path: answerdotai/ModernBERT-base
  sha256: null
  expected_dev_f1: null
