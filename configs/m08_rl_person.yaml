# M08 person-judge pilot (D21): configs/m08_rl_opening.yaml plus an LLM judge that makes a text
# invalid when the requested name is not used as a person. The opening pilot
# (pilot-opening-20261114-124322) fooled the target detector in 233/240 texts, but 236/240 used
# the name as a place or brand ("the nearest Mulaton store"), which the detector rightly ignores.
# Seed, bank, sampling, optimizer, max_steps and the opening guard are unchanged.
# The Modal launcher (scripts/modal_rl.py) overrides the paths and provides MISTRAL_API_KEY.

run_id_prefix: m08-person
model_id: Qwen/Qwen3.5-2B
seed: 20261113
work_dir: artifacts/m08
splits_dir: artifacts/splits
locks:
  final_eval_sha256: 513335badf5752a340698d3c7efa7029a8780c51fde2675c80ef4208ce27d39c
max_minutes: 95                    # hard wall-clock cap on training, then save and stop
stop_at_step: 400                  # end here; max_steps below still sets the lr schedule
resume_from_checkpoint: null
vllm_multimodal_names: true        # sync the text-only attacker into vLLM's multimodal Qwen3.5

bank:
  seed: 20261113
  n_signal: 32                     # same held-out pre/post requests as the long run
  n_train: 2000                    # same bank as the long run
  exclude_banks:
    - banks/v2_prompting/spark_seed20260920_v2_n20.jsonl

detector:
  path: artifacts/d1-frozen-d1v2-20261110-075731
  sha256: ebfe4c693958c84cdb093d1a55b535e51f1ba0563a702e69e3c97bf5a36a4143

model:
  quantize_4bit: false

lora:
  r: 16
  alpha: 32
  target_modules: all-linear

sampling:
  temperature: 1.0
  top_p: 1.0
  batch_prompts: 4

reward:
  opening_share:                   # D20; calibrated on long-20261114-004948 (pre max 0.15, post 0.99)
    full_reward_until: 0.25        # share of other requests' texts with the same opening word
    zero_reward_from: 0.50         # reward falls linearly from full to zero between the two
    window: 256                    # most recent valid texts = 8 steps of 32
    min_other_texts: 128           # no flag until this many texts from other requests are seen
  person_judge:                    # D21; on 486 labelled texts: 248/250 persons kept, 234/236 non-persons rejected
    model: zai-glm-5-3-flash
    api_key_env: MISTRAL_API_KEY
    timeout_s: 60
    max_workers: 32

grpo:
  num_generations: 8
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  max_completion_length: 192
  max_steps: 1000
  learning_rate: 2.0e-5
  beta: 0.02
  scale_rewards: false
  gradient_checkpointing: true
  save_steps: 50
  save_total_limit: 3
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.3
  vllm_max_model_length: 1024

thresholds:                        # health checks, not learning claims
  pre_valid_rate_min: 0.7
  peak_memory_fraction_max: 0.92
  valid_rate_drop_max: 0.10
  skipped_update_fraction_max: 0.5
