name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1" # fail on a stale uv.lock rather than re-resolving it
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Lint and type-check
        run: bash scripts/lint.sh
      - name: Test
        run: make test
