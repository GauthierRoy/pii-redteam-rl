# Run `pre-commit install` once — then these run automatically on `git commit`.
# Run manually with: `pre-commit run --all-files`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # --fix auto-fixes what it can; --exit-non-zero-on-fix blocks the
      # commit so you can review the fix with `git diff`.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.78
    hooks:
      # --isolated: don't create/update uv.lock or .venv on every commit.
      # ty checks the whole project (not just staged files) by default,
      # which is what you want for a type checker.
      - id: ty
        args: [--isolated]
        pass_filenames: false
        always_run: true

# pre-commit.ci has no network access, so ty can't run there.
# Keep it local-only; run `uv run ty check` separately in CI if needed.
ci:
  skip: [ty]
