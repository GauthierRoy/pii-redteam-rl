      mistral_large_2512: { reasoning: none, wall_min: 76, usd: { total: 3.78, writer: 1.73, judge_audit: 2.05 }, train: "276/5099 valid missed (5.4%), 35 in the last 10 steps", post_heldout: "25/194 valid (12.9%), 8 names", distinct_miss_frames: 23, pattern: "terse bureaucratic fragments: 'Princep to review output for accuracy. No further notes.', 'logged under Pham'" }
      deepseek_v4_1_flash: { reasoning: low, wall_min: 103, usd: { total: 10.36, writer: 8.00, judge_audit: 2.35, note: "writer price a high placeholder; 926k reasoning tokens" }, train: "399/5932 (6.7%), 26-43 per 10 steps after step 110", post_heldout: "55/237 (23.2%), 12 names", distinct_miss_frames: 39, pattern: "routine admin lines with the name as action owner or recipient: 'Pham to review before close', 'leave sheet at desk for D'altilia'" }
